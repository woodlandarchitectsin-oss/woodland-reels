name: Instagram stats

on:
  schedule:
    - cron: "17 3 * * 1"   # Mondays 8:47 AM IST
  push:
    paths: [".stats-request"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID || '17841466763710255' }}
        run: python scripts/ig_stats.py
      - run: |
          git config user.name "woodland-reels-bot"
          git config user.email "actions@users.noreply.github.com"
          git add stats
          git diff --cached --quiet || (git commit -m "Instagram stats snapshot" && git pull --rebase -q && git push)
